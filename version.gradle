ext { talkbackVersionName = "TfPu_release_16_2" }

// Meridian's version. A stable release is built with -Pmeridian.release=true and tagged
// v<version>; other builds are <version>-dev. Raise it after each stable release.
ext {
    meridianVersion = "1.1"
    meridianVersionName = meridianVersion + (providers.gradleProperty("meridian.release").getOrElse("false") == "true" ? "" : "-dev")
}

// Git details for the in-app updater. Builds outside a git checkout fall back to build 1 and no hash.
def gitOutput = { List<String> args ->
    try {
        return providers.exec {
            commandLine(['git'] + args)
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return ''
    }
}
// Meridian's build number is the number of commits since the last commit before Meridian numbered
// its own builds, so the first one is build 1. The publish job in .github/workflows/build.yml
// counts the same way. The base was moved back on 2026-11-17 after master was reset to build 2406:
// without this the next build would have been 2413, below the 2464 already installed on phones,
// and Android would refuse the update. With this base the next build is 2466.
def buildNumberBase = "bd967df3072c00f35f310cb11ee8f4c433f1d58a"
def commitCount = gitOutput(['rev-list', '--count', "${buildNumberBase}..HEAD"])
def commitHash = gitOutput(['rev-parse', 'HEAD'])
def buildRef = providers.environmentVariable("GITHUB_REF").getOrElse("")
def branchName = gitOutput(['symbolic-ref', '--quiet', '--short', 'HEAD'])
def taskBranchBuild = buildRef == "refs/heads/feat/vietnamese-task-assistant" ||
    (buildRef.isEmpty() && branchName == "feat/vietnamese-task-assistant")
def effectiveCommitCount = commitCount.isInteger() ? Math.max(commitCount.toInteger(), 1) : 1
if (taskBranchBuild) {
    def masterCount = gitOutput(['rev-list', '--count', "${buildNumberBase}..refs/remotes/origin/master"])
    if (!masterCount.isInteger()) {
        throw new GradleException("Task branch builds require a fetched origin/master reference")
    }
    effectiveCommitCount = Math.max(effectiveCommitCount, masterCount.toInteger() + 1)
}
ext {
    gitCommitCount = effectiveCommitCount
    gitCommitHash = commitHash ==~ /[0-9a-f]{40}/ ? commitHash : ''
}
