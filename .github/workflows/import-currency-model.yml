name: Bundle Vietnamese currency model from verified APK

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/import-currency-model.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import-currency-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore verified model from previous successful APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f talkback/src/main/assets/vn_currency_yolo11n.tflite ]; then
            echo "The currency model is already bundled."
            exit 0
          fi
          gh run download 42479602120 --repo "$GITHUB_REPOSITORY" --name apks --dir "$RUNNER_TEMP/currency-apks"
          apk="$(find "$RUNNER_TEMP/currency-apks" -type f -name 'meridian-phone-debug.apk' -print -quit)"
          test -n "$apk"
          unzip -p "$apk" assets/vn_currency_yolo11n.tflite > talkback/src/main/assets/vn_currency_yolo11n.tflite
          printf '%s  %s\n' 'b3d3727f9ca1fb41789071e5590f7677bca83e9dd61505b322580c52251fddd9' 'talkback/src/main/assets/vn_currency_yolo11n.tflite' | sha256sum --check --status
          python3 - <<'PY'
          from pathlib import Path

          path = Path("talkback/build.gradle")
          source = path.read_text()
          start = source.index('def currencyAssetDir = layout.buildDirectory.dir("generated/currency-model-assets")')
          finish = source.index("ext.activationDirectory = file('../activation')", start)
          path.write_text(source[:start] + source[finish:])
          PY
          if grep -q 'prepareCurrencyModel' talkback/build.gradle; then
            echo "Unexpected remaining currency-model download step."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add talkback/build.gradle talkback/src/main/assets/vn_currency_yolo11n.tflite
          git commit -m "Bundle verified Vietnamese currency model for offline builds"
          git push origin HEAD:master
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref master
